<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGF · TUNER</title>
<link rel="stylesheet" href="tuner.css">
</head>
<body>
  <header class="tuner-hud">
    <h1>SINE GHOST FILE <span class="dim">· tuner</span></h1>
    <div class="letter-picker" id="letters"></div>
  </header>

  <main>
    <section class="canvas-panel">
      <canvas id="stage"></canvas>
      <div class="probe" id="probe">
        <span class="probe-ch" id="probe-ch">A</span>
        <span class="probe-meta" id="probe-meta"></span>
      </div>
    </section>

    <aside class="controls">
      <h2>parameters</h2>

      <div class="group">
        <label>harmonics <output id="o-harm">128</output></label>
        <input type="range" id="harm" min="8" max="256" step="8" value="128">
      </div>

      <div class="group">
        <label>scale <output id="o-scale">100</output></label>
        <input type="range" id="scale" min="20" max="220" step="2" value="100">
      </div>

      <div class="group">
        <label>speed <output id="o-speed">1.0</output></label>
        <input type="range" id="speed" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="group">
        <label>resolution <output id="o-res">200</output></label>
        <input type="range" id="res" min="60" max="400" step="10" value="200">
      </div>

      <div class="group">
        <label>show epicycles</label>
        <select id="epicycles"><option value="off">off</option><option value="on">on</option></select>
      </div>

      <div class="group">
        <label>color</label>
        <select id="color">
          <option value="#00FFFF">cyan</option>
          <option value="#FFFFFF">white</option>
          <option value="#FF00FF">magenta</option>
          <option value="#7FFF00">acid</option>
        </select>
      </div>

      <button id="btn-verify" title="match vs full-harmonic truth">verify</button>
      <button id="btn-reset">reset</button>
      <div class="mem-note" id="mem-note"></div>
    </aside>
  </main>

  <script type="module" src="tuner.js"></script>
</body>
</html>
