<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNATONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="hud">
    <h1 class="brand" id="titleTrig"><span class="sigil">◈</span>&nbsp;SIGNATONE</h1>
    <p class="sub">The sound is the form.</p>
  </header>

  <button class="settings-toggle" id="btn-settings" title="hidden configuration" aria-label="settings">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1">
      <circle cx="8" cy="8" r="2.1"/>
      <path d="M8 1.2v2 M8 12.8v2 M1.2 8h2 M12.8 8h2 M3 3l1.4 1.4 M11.6 11.6L13 13 M13 3l-1.4 1.4 M4.4 11.6L3 13" stroke-linecap="round"/>
    </svg>
  </button>

  <aside class="hidden-panel" id="settings" hidden>
    <h2>configuration</h2>
    <div class="grp">
      <label>harmonics <output id="o-harmo">10</output></label>
      <input type="range" id="set-harmo" min="1" max="60" step="1" value="10">
    </div>
    <div class="grp">
      <label>noise ± <output id="o-noise">0.00</output></label>
      <input type="range" id="set-noise" min="0" max="0.5" step="0.01" value="0">
    </div>
    <div class="grp">
      <label>seed <output id="o-seed">12345</output></label>
      <input type="range" id="set-seed" min="1" max="99999" step="1" value="12345">
    </div>
    <div class="grp">
      <label>speed <output id="o-speed">1.0</output></label>
      <input type="range" id="set-speed" min="0.25" max="4" step="0.05" value="1">
    </div>
    <div class="grp">
      <label>spacing <output id="o-spacing">1.7</output></label>
      <input type="range" id="set-spacing" min="1" max="2.5" step="0.05" value="1.7">
    </div>
    <div class="grp">
      <label>single-line max <output id="o-single">14</output></label>
      <input type="range" id="set-single" min="1" max="30" step="1" value="14">
    </div>
    <div class="grp">
      <label>accent <output id="o-accent">#E8A33D</output></label>
      <input type="color" id="set-accent" value="#E8A33D">
    </div>
    <div class="grp grp-chk">
      <label class="chk"><input type="checkbox" id="set-glow" checked> trace glow</label>
    </div>
    <button id="btn-close-settings">close</button>
  </aside>

  <main class="command" id="command">
    <section class="field weave">
      <label for="msg">plaintext</label>
      <textarea id="msg" spellcheck="false" autocomplete="off" placeholder="SIGNAL"></textarea>
    </section>
    <section class="actions">
      <button id="btn-weave" class="action">Weave &amp; Download</button>
      <button id="btn-see" class="action">Upload &amp; See</button>
      <input type="file" id="file" accept=".wav,audio/wav" hidden>
    </section>
  </main>

  <div class="status" id="status">—</div>

  <!-- stealth toast (hidden by default) -->
  <div class="stealth" id="stealth" hidden>◈ signal sealed — no trace left</div>

  <script type="module" src="app.js?v=20260817e"></script>
</body>
</html>
