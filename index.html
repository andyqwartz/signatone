<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINE GHOST FILE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="hud">
    <h1 class="title" id="titleTrig">SINE&nbsp;GHOST&nbsp;FILE</h1>
    <p class="sub">transmission is a lie — the exchange is a proof</p>
  </header>

  <aside class="hidden-panel" id="settings" hidden>
    <h2>hidden configuration</h2>
    <div class="grp">
      <label>harmonics <output id="o-harmo">10</output></label>
      <input type="range" id="set-harmo" min="1" max="60" step="1" value="10">
    </div>
    <div class="grp">
      <label>noise ± <output id="o-noise">0.00</output></label>
      <input type="range" id="set-noise" min="0" max="0.5" step="0.01" value="0">
    </div>
    <div class="grp">
      <label>seed <output id="o-seed">12345</output></label>
      <input type="range" id="set-seed" min="1" max="99999" step="1" value="12345">
    </div>
    <button id="btn-close-settings">close</button>
  </aside>

  <main class="command">
    <section class="panel weave">
      <label for="msg">plaintext</label>
      <textarea id="msg" spellcheck="false" autocomplete="off" placeholder="HELLO"></textarea>
      <button id="btn-weave">Weave &amp; Download</button>
    </section>

    <section class="panel see">
      <label for="file">signal</label>
      <input type="file" id="file" accept=".wav,audio/wav">
      <button id="btn-see">Upload &amp; See</button>
    </section>
  </main>

  <div class="status" id="status">—</div>

  <script type="module" src="app.js?v=20260817b"></script>
</body>
</html>
