<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNATONE — The sound is the form.</title>
<meta name="description" content="Text and images woven into signal, decoded as living Fourier epicycles.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="mode-encode">

  <canvas id="stage"></canvas>

  <header class="hud">
    <h1 class="brand" id="titleTrig"><span class="sigil">◈</span>&nbsp;SIGNATONE</h1>
    <p class="sub">The sound is the form.</p>
  </header>

  <!-- mode switch -->
  <nav class="modes" id="modes">
    <button class="mode-btn is-active" id="btn-mode-encode">Encode</button>
    <button class="mode-btn" id="btn-mode-decode">Decode</button>
  </nav>

  <!-- top-right: signal config gear + audio config -->
  <div class="top-right">
    <button class="settings-toggle" id="btn-settings" title="configuration" aria-label="configuration">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.2v2 M8 12.8v2 M1.2 8h2 M12.8 8h2 M3 3l1.4 1.4 M11.6 11.6L13 13 M13 3l-1.4 1.4 M4.4 11.6L3 13" stroke-linecap="round"/></svg>
    </button>
    <button class="settings-toggle audio" id="btn-audio" title="audio" aria-label="audio">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 6v4 M5 4v8 M8 2v12 M11 4v8 M14 6v4" stroke-linecap="round"/></svg>
    </button>
    <button class="settings-toggle audio" id="btn-img-opt" title="image" aria-label="image">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="11.2" cy="6.2" r="1.1"/><path d="M2 12l3.5-3.5 2.5 2.5 3-3L14 12"/></svg>
    </button>
  </div>

  <!-- signal configuration -->
  <aside class="hidden-panel" id="settings" hidden>
    <h2>configuration</h2>
    <div class="grp"><label>harmonics <output id="o-harmo">10</output></label><input type="range" id="set-harmo" min="1" max="60" step="1" value="10"></div>
    <div class="grp"><label>noise ± <output id="o-noise">0.00</output></label><input type="range" id="set-noise" min="0" max="0.5" step="0.01" value="0"></div>
    <div class="grp"><label>seed <output id="o-seed">12345</output></label><input type="range" id="set-seed" min="1" max="99999" step="1" value="12345"></div>
    <div class="grp"><label>speed <output id="o-speed">1.0</output></label><input type="range" id="set-speed" min="0.25" max="4" step="0.05" value="1"></div>
    <div class="grp"><label>spacing <output id="o-spacing">1.7</output></label><input type="range" id="set-spacing" min="1" max="2.5" step="0.05" value="1.7"></div>
    <div class="grp"><label>single-line max <output id="o-single">14</output></label><input type="range" id="set-single" min="1" max="30" step="1" value="14"></div>
    <div class="grp"><label>accent <output id="o-accent">#7e61d4</output></label><input type="color" id="set-accent" value="#7e61d4"></div>
    <div class="grp grp-chk"><label class="chk"><input type="checkbox" id="set-glow" checked> trace glow</label></div>
    <button id="btn-close-settings">close</button>
  </aside>

  <!-- contextual audio configuration -->
  <aside class="hidden-panel" id="audio-options" hidden>
    <h2 id="audio-title">audio · encode</h2>
    <div class="grp" data-aud="enc"><label>gain <output id="o-a-gain">1.00</output></label><input type="range" id="set-a-gain" min="0.1" max="2" step="0.05" value="1"></div>
    <div class="grp" data-aud="enc"><label>tempo <output id="o-a-tempo">1.00</output></label><input type="range" id="set-a-tempo" min="0.5" max="2" step="0.05" value="1"></div>
    <div class="grp" data-aud="dec"><label>volume <output id="o-a-vol">1.00</output></label><input type="range" id="set-a-vol" min="0" max="1" step="0.05" value="1"></div>
    <div class="grp" data-aud="dec"><label>tempo <output id="o-a-tempo2">1.00</output></label><input type="range" id="set-a-tempo2" min="0.5" max="2" step="0.05" value="1"></div>
    <button id="btn-close-audio">close</button>
  </aside>

  <!-- image configuration -->
  <aside class="hidden-panel" id="img-options" hidden>
    <h2>image · silhouette</h2>
    <div class="grp"><label>threshold <output id="o-img-threshold">128</output></label><input type="range" id="set-img-threshold" min="10" max="245" step="1" value="128"></div>
    <div class="grp"><label>sample <output id="o-img-sample">1024</output></label>
      <select id="set-img-sample"><option value="512">512</option><option value="1024" selected>1024</option><option value="2048">2048</option></select></div>
    <div class="grp"><label>harmonics <output id="o-img-harms">1024</output></label><input type="range" id="set-img-harms" min="128" max="1024" step="64" value="1024"></div>
    <div class="grp"><label>source <output id="o-img-mode">auto</output></label>
      <select id="set-img-mode"><option value="auto" selected>auto</option><option value="alpha">alpha</option><option value="luma">luma</option></select></div>
    <div class="grp grp-chk"><label class="chk"><input type="checkbox" id="set-img-main"> main curve only</label></div>
    <button id="btn-close-img">close</button>
  </aside>

  <!-- ENCODE view -->
  <main class="command" id="view-encode">
    <section class="field weave">
      <label for="msg">plaintext</label>
      <textarea id="msg" spellcheck="false" autocomplete="off" placeholder="The sound is the form."></textarea>
    </section>
    <section class="actions">
      <button id="btn-weave" class="action">Weave</button>
      <label id="btn-img" class="action file-label">α Image
        <input type="file" id="imgfile" accept="image/*">
      </label>
      <button id="btn-export" class="action ghost">⇩ img</button>
      <button id="btn-txt" class="action ghost" hidden>↓ txt</button>
    </section>
  </main>

  <!-- DECODE view -->
  <main class="command" id="view-decode" hidden>
    <section class="field see">
      <label>signal</label>
      <input type="file" id="file" accept=".wav,audio/wav">
      <button id="btn-see" class="action inline">Upload &amp; See</button>
    </section>
    <section class="actions">
      <button id="btn-export2" class="action ghost">⇩ img</button>
      <button id="btn-txt2" class="action ghost" hidden>↓ txt</button>
    </section>
  </main>

  <!-- audio players -->
  <div class="player" id="player-encode" hidden>
    <button class="play" id="play-encode">▶</button>
    <input type="range" class="scrub" id="scrub-encode" min="0" max="1000" value="0">
    <span class="time" id="time-encode">0:00 / 0:00</span>
    <audio id="audio-encode" hidden></audio>
  </div>
  <div class="player" id="player-decode" hidden>
    <button class="play" id="play-decode">▶</button>
    <input type="range" class="scrub" id="scrub-decode" min="0" max="1000" value="0">
    <span class="time" id="time-decode">0:00 / 0:00</span>
    <audio id="audio-decode" hidden></audio>
  </div>

  <div class="status" id="status">—</div>

  <!-- export panel -->
  <div class="export-panel" id="export-panel" hidden>
    <span class="export-label">export</span>
    <button id="exp-png" class="action ghost" title="Capture the current frame as a PNG">still · PNG</button>
    <button id="exp-gif" class="action ghost" title="Render the full epicycle animation as a GIF">animate · GIF</button>
  </div>

  <!-- quiet confirmation -->
  <div class="seal" id="seal" hidden>◈ signal captured</div>

  <script src="js/vendor/gif.js"></script>
  <script type="module" src="app.js?v=20260817j"></script>
</body>
</html>
